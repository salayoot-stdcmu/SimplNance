services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8282:8282"
    restart: always
    command: gunicorn -w 4 -b 0.0.0.0:8282 main:app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3456:3456"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    restart: always
    command: npm run dev -- --host 0.0.0.0 --port 3456